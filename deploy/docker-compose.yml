services:
  db:
    image: mariadb:11.4
    restart: unless-stopped
    environment:
      MARIADB_DATABASE: ${TIDES_DB_NAME:-tides_dev}
      MARIADB_USER: ${TIDES_DB_USER:-tides}
      MARIADB_PASSWORD: ${TIDES_DB_PASSWORD:-tides_dev_password}
      MARIADB_ROOT_PASSWORD: ${TIDES_DB_ROOT_PASSWORD:-change-this-root-password}
    volumes:
      - tides-db:/var/lib/mysql
      - ../server/sql/accounts.sql:/docker-entrypoint-initdb.d/001_accounts.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "mariadb-admin ping -h 127.0.0.1 -u root -p\"$${MARIADB_ROOT_PASSWORD}\" --silent"]
      interval: 5s
      timeout: 5s
      retries: 20

  tides-server:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.server
    image: tides-server:0.3.2
    restart: unless-stopped
    environment:
      MYSQL_HOST: db
      MYSQL_PORT: 3306
      MYSQL_USER: ${TIDES_DB_USER:-tides}
      MYSQL_PASSWORD: ${TIDES_DB_PASSWORD:-tides_dev_password}
      MYSQL_DATABASE: ${TIDES_DB_NAME:-tides_dev}
      MYSQL_ODBC_DRIVER: MariaDB Unicode
    ports:
      - "9500:9500"
    volumes:
      - tides-data:/app/server/data
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "erl -noshell -eval 'case gen_tcp:connect(\"127.0.0.1\", 9500, [], 3000) of {ok,S} -> gen_tcp:close(S), halt(0); _ -> halt(1) end.'"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s

  web:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.client
    image: tides-web:0.1.0
    restart: unless-stopped
    ports:
      - "8080:80"
    depends_on:
      tides-server:
        condition: service_healthy

volumes:
  tides-data:
  tides-db:
