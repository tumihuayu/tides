# 《潮汐商会》docker-compose 专用反代配置（nginx）
# 与 nginx.conf 的唯一区别：proxy_pass 指向 compose 服务名 tides-server:9500。
# 已由 docker-compose.yml 挂载到 /etc/nginx/conf.d/default.conf。
# 宿主机直装请使用 nginx.conf（127.0.0.1:9500）。

# 80 -> 443 跳转（同时保留 ACME http-01 续签路径）
server {
    listen 80;
    listen [::]:80;
    server_name tides.cn;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name tides.cn;

    ssl_certificate     /etc/letsencrypt/live/tides.cn/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/tides.cn/privkey.pem;
    ssl_session_timeout 1d;
    ssl_session_cache   shared:SSL:10m;
    ssl_protocols       TLSv1.2 TLSv1.3;

    root /usr/share/nginx/html;
    index index.html;

    location /ws {
        proxy_pass http://tides-server:9500;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    location /healthz {
        proxy_pass http://tides-server:9500;
        proxy_set_header Host $host;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
