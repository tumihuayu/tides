# 《潮汐商会》生产反向代理配置（nginx）
# 放置位置（任选其一）：
#   1) 宿主机直装：覆盖 /etc/nginx/conf.d/tides.conf（或 sites-available + 软链）
#   2) docker-compose：已挂载到 /etc/nginx/conf.d/default.conf
# 证书获取（certbot，首次签发前先把 80 段跑通）：
#   sudo apt install certbot python3-certbot-nginx
#   sudo certbot --nginx -d tides.cn
# 证书路径使用 Let's Encrypt 标准占位：/etc/letsencrypt/live/tides.cn/

# 80 -> 443 跳转（同时保留 ACME http-01 续签路径）
server {
    listen 80;
    listen [::]:80;
    server_name tides.cn;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name tides.cn;

    # certbot 签发后自动生成；docker 场景需把宿主机 /etc/letsencrypt 挂进来
    ssl_certificate     /etc/letsencrypt/live/tides.cn/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/tides.cn/privkey.pem;
    ssl_session_timeout 1d;
    ssl_session_cache   shared:SSL:10m;
    ssl_protocols       TLSv1.2 TLSv1.3;

    # 静态前端：client/dist（docker-compose 挂载到 /usr/share/nginx/html）
    root /usr/share/nginx/html;
    index index.html;

    # WebSocket 反代到 Erlang 服务端
    # 宿主机直装用 127.0.0.1:9500；docker-compose 中改用 http://tides-server:9500
    location /ws {
        proxy_pass http://127.0.0.1:9500;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # 健康检查（服务端 tides_ws_conn 直接应答）
    location /healthz {
        proxy_pass http://127.0.0.1:9500;
        proxy_set_header Host $host;
    }

    # SPA 路由回退
    location / {
        try_files $uri $uri/ /index.html;
    }
}
